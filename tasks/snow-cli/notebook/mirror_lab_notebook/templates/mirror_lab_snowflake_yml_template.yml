definition_version: 2
entities:
  mirror_lab_notebook:
    type: notebook
    query_warehouse: {{ warehouse_name }}
    identifier:
      name: {{ notebook_name }}
      database: {{ database_name }}
      schema: {{ schema_name }}
    stage_path: {{ database_name }}.{{ schema_name }}.{{ stage_name }}
    notebook_file: {{ notebook_file }}
    artifacts:
    - {{ notebook_file }}
