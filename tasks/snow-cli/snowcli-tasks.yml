version: '3'

# Snowflake-side tasks. Every snow command passes --connection
# "$CLI_CONNECTION_NAME"; <% ctx.env.X %> placeholders in sql/ resolve from
# the environment that Task loads from .env/mirror.env.

tasks:

  run-sql-file:
    desc: Runs one SQL file against Snowflake.
    internal: true
    cmds:
      - snow sql --connection "$CLI_CONNECTION_NAME" -f "{{.SQL_FILE}}"

  sort-and-process-sql-folder:
    desc: Sorts and processes all SQL files in the given directory. Sorts and executes SQL files with numeric prefixes (e.g., 001-schema.sql)
    internal: true
    cmds:
      - python3 pyutil/snowclisp/snowclisp.py "{{.SQL_SORT_PROCESS_DIR}}" "$CLI_CONNECTION_NAME" --prefix-file sql/whoami.sql

  # -----------------------------------------------------------------------
  # DCM (Database Change Management)
  #
  # Two DCM projects, one folder each under dcm/, selected with DCM_PROJECT:
  #   iot_mirror_lab        setup: lab database / schema / stage, warehouse,
  #                         analyst role, and (create mode) the Postgres
  #                         ingress network rule and policy
  #   iot_mirror_analytics  step 7: dynamic table and semantic view on the
  #                         mirrored tables, so it is deployed second and
  #                         purged first
  #
  # pyutil/dcm/dcm.py runs snow dcm inside the project folder (plan writes
  # that project's out/), as MIRROR_ADMIN_ROLE_NAME: DCM makes the executing
  # role the owner of every object it creates. It passes the project
  # identifier and every templating variable from .env/mirror.env.
  # -----------------------------------------------------------------------

  dcm-project-home:
    desc: Creates DCM_PROJECT_DATABASE.DCM_PROJECT_SCHEMA, which holds the DCM project objects (a project cannot define its own parent).
    internal: true
    cmds:
      - task: run-sql-file
        vars:
          SQL_FILE: sql/init/dcm_project_home.sql

  dcm-create:
    desc: Registers a DCM project object in Snowflake if it does not already exist.
    internal: true
    requires:
      vars: [DCM_PROJECT]
    cmds:
      - python3 pyutil/dcm/dcm.py create "{{.DCM_PROJECT}}"

  dcm-analyze:
    desc: Validates a DCM project's definitions; fails only on issues above INFO. Applies nothing.
    internal: true
    requires:
      vars: [DCM_PROJECT]
    cmds:
      - python3 pyutil/dcm/dcm.py analyze "{{.DCM_PROJECT}}"

  dcm-plan:
    desc: Shows what a DCM project would create, alter, or drop. Applies nothing.
    internal: true
    requires:
      vars: [DCM_PROJECT]
    cmds:
      - python3 pyutil/dcm/dcm.py plan "{{.DCM_PROJECT}}"

  dcm-deploy:
    desc: Reconciles Snowflake with a DCM project's definitions.
    internal: true
    requires:
      vars: [DCM_PROJECT, DCM_ALIAS]
    cmds:
      - python3 pyutil/dcm/dcm.py deploy "{{.DCM_PROJECT}}" --alias "{{.DCM_ALIAS}}"

  dcm-purge:
    desc: Drops every Snowflake object a DCM project manages. Irreversible; skipped if the project is gone.
    internal: true
    requires:
      vars: [DCM_PROJECT]
    cmds:
      - python3 pyutil/dcm/dcm.py purge "{{.DCM_PROJECT}}" --yes

  dcm-drop:
    desc: Removes a DCM project registration. Leaves managed objects untouched, so purge first.
    internal: true
    requires:
      vars: [DCM_PROJECT]
    cmds:
      - python3 pyutil/dcm/dcm.py drop "{{.DCM_PROJECT}}"

  dcm-up:
    desc: Registers (if needed) and deploys a DCM project.
    internal: true
    requires:
      vars: [DCM_PROJECT, DCM_ALIAS]
    cmds:
      - task: dcm-create
        vars:
          DCM_PROJECT: '{{.DCM_PROJECT}}'
      - task: dcm-deploy
        vars:
          DCM_PROJECT: '{{.DCM_PROJECT}}'
          DCM_ALIAS: '{{.DCM_ALIAS}}'

  dcm-down:
    desc: Purges a DCM project's objects, then removes its registration.
    internal: true
    requires:
      vars: [DCM_PROJECT]
    cmds:
      - task: dcm-purge
        vars:
          DCM_PROJECT: '{{.DCM_PROJECT}}'
      - task: dcm-drop
        vars:
          DCM_PROJECT: '{{.DCM_PROJECT}}'

  # -----------------------------------------------------------------------
  # Postgres instance
  # -----------------------------------------------------------------------

  pg-instance-create:
    desc: Creates (or reuses) the Postgres instance and saves the connection without displaying secrets.
    internal: true
    cmds:
      - python3 pyutil/pginstance/pg_instance.py create

  pg-instance-attach:
    desc: Verifies a bring-your-own instance and saves its service entry (existing mode).
    internal: true
    cmds:
      - python3 pyutil/pginstance/pg_instance.py attach

  pg-instance-info:
    desc: Shows safe Postgres instance fields (never access_roles).
    internal: true
    cmds:
      - python3 pyutil/pginstance/pg_instance.py info

  pg-instance-reset-access:
    desc: Rotates the PG_USER password and saves it to ~/.pgpass without displaying it.
    internal: true
    cmds:
      - python3 pyutil/pginstance/pg_instance.py reset-access --yes

  pg-instance-drop:
    desc: Drops the lab's Postgres instance (create mode only) and waits until it is gone.
    internal: true
    cmds:
      - python3 pyutil/pginstance/pg_instance.py drop --yes

  pg-instance-forget:
    desc: Removes the local service entry, password line, and CA cert for the lab instance.
    internal: true
    cmds:
      - python3 pyutil/pginstance/pg_instance.py forget

  mirror-grants:
    desc: Grants USAGE on the Postgres instance to the snowflake application (as the owning role).
    internal: true
    cmds:
      - task: run-sql-file
        vars:
          SQL_FILE: sql/mirror/001-grants.sql

  grant-analyst-read:
    desc: Delegates read access on the mirrored data (<TARGET>_ADMIN database role) to the analyst role.
    internal: true
    cmds:
      - task: run-sql-file
        vars:
          SQL_FILE: sql/mirror/003-grant_analyst_read.sql

  generate-notebook:
    desc: Generates the mirror lab notebook from its template with variable substitution.
    internal: true
    vars:
      TEMPLATE_FILE: '{{.TEMPLATE_FILE | default "notebook/mirror_lab_notebook/templates/mirror_lab_template.ipynb"}}'
      OUTPUT_FILE: '{{.OUTPUT_FILE | default "notebook/mirror_lab_notebook/generated/mirror_lab_notebook.ipynb"}}'
      VARIABLES_FILE: '{{.VARIABLES_FILE | default "notebook/mirror_lab_notebook/variables.json"}}'
    cmds:
      - cmd/generate-notebook-generic.sh "{{.TEMPLATE_FILE}}" "{{.OUTPUT_FILE}}" "{{.VARIABLES_FILE}}"

  deploy-notebook:
    desc: Uploads the generated notebook to the lab's personal workspace (Notebooks in Workspaces).
    internal: true
    vars:
      NOTEBOOK_FILE: '{{.NOTEBOOK_FILE | default "notebook/mirror_lab_notebook/generated/mirror_lab_notebook.ipynb"}}'
    cmds:
      - python3 pyutil/notebook/workspace_notebook.py deploy "{{.NOTEBOOK_FILE}}"

  notebook-url:
    desc: Prints the Snowsight URL of the deployed notebook.
    internal: true
    vars:
      NOTEBOOK_FILE: '{{.NOTEBOOK_FILE | default "notebook/mirror_lab_notebook/generated/mirror_lab_notebook.ipynb"}}'
    cmds:
      - python3 pyutil/notebook/workspace_notebook.py url "{{.NOTEBOOK_FILE}}"

  notebook-drop:
    desc: Drops the lab's notebook workspace.
    internal: true
    cmds:
      - python3 pyutil/notebook/workspace_notebook.py drop --yes
